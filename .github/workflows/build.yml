name: Build

on:
  push:
    branches: [main, master]
  workflow_dispatch: {}

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      # Generates android/ (and fills in anything missing under web/) using
      # the runner's actual Flutter version, instead of hand-committed
      # platform boilerplate that could drift out of date.
      - name: Ensure platform folders exist
        run: flutter create --org com.naeimkhan --platforms=android .

      - run: flutter pub get

      - name: Build release APK
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          flutter build apk --release \
            --dart-define=SUPABASE_URL=$SUPABASE_URL \
            --dart-define=SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY

      - uses: actions/upload-artifact@v4
        with:
          name: daily-tracker-app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

  analyze:
    name: Static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter create --org com.naeimkhan --platforms=android .
      - run: flutter pub get
      - run: flutter analyze
